# Multi-brand reverse proxy:
# - inner domain and sprint-power domain point to one Next.js app
# - brand is resolved in app by Host / X-Forwarded-Host, optionally forced via X-Brand
# - this config always redirects HTTP to HTTPS

map $host $ih_proxy_brand {
  default                    "";
  sprintpower.ru             sprint-power;
  www.sprintpower.ru         sprint-power;
  sprintpower.inetrnet.pp.ru sprint-power;
}

server {
  listen 80;
  server_name innerhealth.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
    try_files $uri =404;
  }

  location / {
    return 301 https://innerhealth.ru$request_uri;
  }
}

server {
  listen 80;
  server_name www.innerhealth.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
    try_files $uri =404;
  }

  location / {
    return 301 https://innerhealth.ru$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name innerhealth.ru;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $app_backend "http://app:3000";

  ssl_certificate     /etc/nginx/ssl/innerhealth-fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/innerhealth-privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:50m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  client_max_body_size 20M;

  location /uploads/ {
    proxy_pass $app_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Brand $ih_proxy_brand;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Next.js static chunks (JS/CSS) — с диска, в обход Node (см. docker-entrypoint.sh).
  # Устраняет гонку, при которой CSS застревал в очереди за медленным SSR-рендером на слабом app-контейнере.
  location /_next/static/ {
    alias /var/www/next-static/;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    proxy_pass $app_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Brand $ih_proxy_brand;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}

server {
  listen 443 ssl http2;
  server_name www.innerhealth.ru;

  ssl_certificate     /etc/nginx/ssl/innerhealth-fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/innerhealth-privkey.pem;

  return 301 https://innerhealth.ru$request_uri;
}

